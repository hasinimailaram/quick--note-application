<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quick Note Application</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Quick Note Application</h1>
        <p>Create, view and delete your notes</p>
    </header>

    <main>

        <section class="note-form">

            <h2>Create a Note</h2>

            <form id="noteForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Enter note title"
                    required
                >

                <textarea
                    id="content"
                    placeholder="Write your note..."
                    required
                ></textarea>

                <button type="submit">
                    Add Note
                </button>

            </form>

            <p id="message"></p>

        </section>


        <section class="notes-section">

            <div class="notes-heading">

                <h2>My Notes</h2>

                <button id="refreshBtn">
                    Refresh
                </button>

            </div>

            <div id="notesList"></div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
